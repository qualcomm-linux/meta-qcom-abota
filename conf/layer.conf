# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS      += "qti-generic-revised"
BBFILE_PATTERN_qti-generic-revised   = "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-generic-revised  = "15"

LAYERDEPENDS_qti-generic-revised = "qcom swupdate"
LAYERSERIES_COMPAT_qti-generic-revised = "kirkstone scarthgap wrynose blacksail"

LICENSE_PATH += "${LAYERDIR}/files/common-licenses"
