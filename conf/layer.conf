# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS      += "qti-generic-revised"
BBFILE_PATTERN_qti-generic-revised   = "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-generic-revised  = "15"

LAYERDEPENDS_qti-generic-revised = "qcom swupdate"
LAYERSERIES_COMPAT_qti-generic-revised = "kirkstone scarthgap wrynose blacksail"

LICENSE_PATH += "${LAYERDIR}/files/common-licenses"

QCOM_BOOTIMG_ROOTFS:qcs8300-ride-sx = "PARTLABEL=system"

# Directory holding the ABOTA signing material (public cert + private key) when
# ABOTA_SIGNING = "1". Both the build-side .swu signing
# (classes/qcom-swupdate-abota-image.bbclass) and the device-side verification
# cert install (recipes-support/swupdate/swupdate_%.bbappend) resolve the
# keypair out of this one directory, so the customer drops cert + key in a
# single place. Override in local.conf (or export ABOTA_SIGNING_DIR) to point
# at a product/CI secrets dir outside the layer. Default is the image recipe's
# files dir inside this layer (DEVELOPMENT ONLY; the layer ships no keypair).
ABOTA_SIGNING_DIR ?= "${LAYERDIR}/recipes-products/images/files"

