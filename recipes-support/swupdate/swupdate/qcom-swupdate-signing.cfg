# Device-side SIGNATURE verification, merged into the swupdate build only when
# ABOTA_SIGNING = "1" (added to SRC_URI conditionally by swupdate_%.bbappend).
# With these set, the binary rejects any .swu whose sw-description.sig does not
# verify against the public cert at public-key-file (see qcom-swupdate-runtime.conf),
# so this must stay paired with build-side signing in qcom-swupdate-abota-image.bbclass.
#
# This fragment is SIGNING-ONLY. sha256 hashing (CONFIG_HASH_VERIFY) is enabled
# unconditionally in the always-applied qcom-swupdate.cfg, not here, because the
# sw-description templates carry hashes even for unsigned packages. CONFIG_SIGNED_IMAGES
# "select"s HASH_VERIFY upstream, so enabling signing here only reinforces that
# already-on hashing -- it never turns hashing on or off on its own.
CONFIG_SIGNED_IMAGES=y
CONFIG_SIGALG_CMS=y
# CONFIG_CMS_IGNORE_EXPIRED_CERTIFICATE is not set
# CONFIG_SIGALG_RAWRSA is not set
# CONFIG_SIGALG_RSAPSS is not set
# CONFIG_SIGALG_GPG is not set
