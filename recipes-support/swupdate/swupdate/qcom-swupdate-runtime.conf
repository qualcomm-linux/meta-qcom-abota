# swupdate runtime config installed as /etc/swupdate.cfg.
#
# When ABOTA_SIGNING = "1", swupdate_%.bbappend appends a public-key-file line
# into the globals block below at install time, pointing at the installed
# verification cert (SWUPDATE_PUBLIC_CERT). With signing off, no such line is
# added and swupdate accepts unsigned packages, so this file ships without it.
globals :
{
};
