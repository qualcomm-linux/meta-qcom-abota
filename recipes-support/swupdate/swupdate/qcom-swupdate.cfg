# Base swupdate build config, always applied.
#
# sha256 hashing is ALWAYS enabled here, independent of signing: the
# sw-description templates in recipes-products/images/files carry a sha256 on
# every image and script entry, and a binary built without CONFIG_HASH_VERIFY
# rejects any supplied hash outright ("hash verification not enabled but hash
# supplied for ..." -- see check_hash_absent() in swupdate core/parser.c). So
# the hashes in every .swu this layer produces require HASH_VERIFY on-device
# whether or not the package is signed.
#
# Signature verification is a separate, optional layer on top: CONFIG_SIGNED_IMAGES
# and the CMS algorithm selection live in qcom-swupdate-signing.cfg and are merged
# in only when ABOTA_SIGNING = "1" (see swupdate_%.bbappend). ABOTA_SIGNING toggles
# ONLY signing (.sig generation, public-cert install, on-device sig verification);
# it does not gate hashing. (SIGNED_IMAGES selects HASH_VERIFY upstream, so turning
# signing on never conflicts with the always-on hashing set here.)
CONFIG_HASH_VERIFY=y
CONFIG_RDIFFHANDLER=y

# Lua interpreter, required by the embedded-script set_device() hook in the
# sw-description templates (recipes-products/images/files/sw-description*).
# That hook resolves each image's target device to the inactive slot at install
# time, which is what lets one images: block serve both slots instead of
# duplicated slot_a/slot_b stanzas.
#
# This must stay enabled while those templates carry an embedded-script:
# parse_cfg() in swupdate's parser/parser.c is fail-closed -- with Lua missing
# it aborts the update outright ("Required embedded script but no Lua not
# available") rather than ignoring the hook and installing to a default device.
# Setting it here also pulls lua into the recipe's DEPENDS, because
# meta-swupdate's swupdate.inc keys that dependency off CONFIG_LUA=y in the
# merged defconfig.
CONFIG_LUA=y
